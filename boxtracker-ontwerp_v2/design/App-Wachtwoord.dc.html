<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wachtwoord</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#F3E9D8;color:#1A140E;-webkit-font-smoothing:antialiased}
a{color:#6E4424}a:hover{color:#1A140E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: #F3E9D8; background-image: repeating-linear-gradient(90deg, rgba(120,80,40,0.035) 0 2px, transparent 2px 11px); font-family: 'Geist', system-ui, sans-serif; color: #1A140E">
<div style="height: 64px; padding: 0 8px; display: flex; align-items: center">
<a href="App-Inloggen.dc.html" aria-label="Terug naar inloggen" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #1A140E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
</div>

<sc-if value="{{vergeten}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Wachtwoord vergeten</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #6B5C4A">Vul je e-mailadres in. Je krijgt een link om een nieuw wachtwoord te kiezen.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">E-mail<input type="email" placeholder="naam@voorbeeld.nl" style="height: 52px; border-radius: 14px; border: 1.5px solid #9A8A74; background: #FFFDF8; padding: 0 16px; font-family: inherit; font-size: 17px; color: #1A140E"></label>
</div>
<div style="padding: 16px 20px 32px">
<button type="button" style="width: 100%; height: 56px; border-radius: 16px; border: 0; background: #936037; color: #FFFDF8; border: 2px solid #1A140E; box-shadow: 0 3px 0 #1A140E; font-family: inherit; font-size: 17px; font-weight: 600">Link versturen</button>
</div>
</div>
</sc-if>

<sc-if value="{{nieuw}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Nieuw wachtwoord</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #6B5C4A">Voor sanne@voorbeeld.nl</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Nieuw wachtwoord<input type="password" placeholder="Minstens [N] tekens" style="height: 52px; border-radius: 14px; border: 1.5px solid #9A8A74; background: #FFFDF8; padding: 0 16px; font-family: inherit; font-size: 17px; color: #1A140E"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500">Nog een keer<input type="password" placeholder="Hetzelfde wachtwoord" style="height: 52px; border-radius: 14px; border: 1.5px solid #9A8A74; background: #FFFDF8; padding: 0 16px; font-family: inherit; font-size: 17px; color: #1A140E"></label>
</div>
</div>
<div style="padding: 16px 20px 32px">
<button type="button" style="width: 100%; height: 56px; border-radius: 16px; border: 0; background: #936037; color: #FFFDF8; border: 2px solid #1A140E; box-shadow: 0 3px 0 #1A140E; font-family: inherit; font-size: 17px; font-weight: 600">Wachtwoord opslaan</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stap":{"editor":"enum","options":["vergeten","nieuw"],"default":"vergeten"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var n = this.props.stap === 'nieuw';
    return { vergeten: !n, nieuw: n };
  }
}
</script>
</body>
</html>
